[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iris-segmentation-model"
version = "1.0.0"
description = "Dual-view DINOv2 iris segmentation model and training GUI"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy>=2.0",
  "opencv-python>=4.10",
  "Pillow>=10",
  "PyYAML>=6",
  "scipy>=1.12",
  "timm>=1.0",
  "torch>=2.11,<2.12",
  "torchvision>=0.26,<0.27",
]

[project.scripts]
iris-data = "iris_system.cli.data:main"
iris-train = "iris_system.cli.train:main"
iris-evaluate = "iris_system.cli.evaluate:main"
iris-annotate = "iris_system.cli.annotate:main"
iris-gui = "iris_system.gui.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
